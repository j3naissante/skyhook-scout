[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skyhook-scout"
version = "1.1.0"
description = "EVE Online skyhook windows and EVE Scout route planner"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6>=6.8,<7", "requests>=2.32,<3"]

[project.gui-scripts]
skyhook-scout = "skyhook_scout.__main__:main"

[tool.setuptools.package-data]
skyhook_scout = ["assets/*"]


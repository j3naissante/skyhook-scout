[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skyhook-scout"
dynamic = ["version"]
description = "EVE Online skyhook windows and EVE Scout route planner"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6>=6.8,<7", "requests>=2.32,<3"]

[project.gui-scripts]
skyhook-scout = "skyhook_scout.__main__:main"

[tool.setuptools.package-data]
skyhook_scout = ["assets/*"]

[tool.setuptools.dynamic]
version = {attr = "skyhook_scout.__version__"}

[tool.setuptools.packages.find]
include = ["skyhook_scout*"]
namespaces = false

